<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#B5121B">
<title>Stock Count Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a66;--line:#e4e2dc;--chip:#efede8;--accent:#c8102e;--ok:#1f7a4d;--okbg:#e3f3ea;--warn:#a46200;--warnbg:#fdf0dc;--bad:#b3261e;--badbg:#fbe4e2;--ops:#1f7a4d;--fin:#c8102e}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1d;--ink:#f1f0ec;--mute:#a3a19b;--line:#33322f;--chip:#2a2927;--accent:#ff4d64;--ok:#5fd39b;--okbg:#173526;--warn:#f2b04c;--warnbg:#3a2a10;--bad:#ff7a6e;--badbg:#3d1714;--ops:#4cbf86;--fin:#ef5b70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:34px;width:auto;display:block}
h1{font-size:18px;margin:0}
.sub{font-size:13px;color:var(--mute)}
.sp{flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--mute);white-space:nowrap;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
main{max-width:1200px;margin:0 auto;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bar{margin:8px 0}
.bar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .t{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:99px}
.vrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.vrow div{font-size:12px;color:var(--mute)}.vrow b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.neg{color:var(--bad)!important}.pos{color:var(--ok)!important}
.muted{color:var(--mute)}.small{font-size:12.5px}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--mute)}
.center{text-align:center;padding:40px 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--mute)}
.card{margin-bottom:12px}.card h3{font-size:15px;margin:0 0 8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mute);font-weight:600}.n{text-align:right;font-variant-numeric:tabular-nums}
.sec{font-size:17px;margin:18px 0 10px}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px}.banner.warn{background:var(--warnbg);color:var(--warn)}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
</style>
</head>
<body>
<header>
  <img src="../assets/logo.png" alt="Nabati">
  <div><h1 id="title">Stock Count Dashboard</h1><div class="sub" id="sub">Loading…</div></div>
  <div class="sp"></div>
  <span class="pill" id="live">…</span>
  <a href="../" style="margin-left:8px;color:inherit;font-size:13px;white-space:nowrap">← Counting app</a>
</header>
<main id="app"><section id="kpi"></section><section id="dcc"><div class="center muted">Loading…</div></section><section id="monthly"></section></main>
<script>
/* New version? Re-download every file first, so the phone never mixes old and new code (GitHub Pages lets browsers cache files ~10 min). */
(function () {
  var FILES = ["../js/api.js", "../js/app.js", "../js/config.js", "../js/count.js", "../js/daily.js", "../js/dcc.js", "../js/export.js", "../js/home.js", "../js/hqdash.js", "../js/kpi.js", "../js/master.js", "../js/photos.js", "../js/pure.js", "../js/scan.js", "../js/setup.js", "../js/state.js", "../js/sup.js", "../js/today.js", "../js/ui.js", "dash.js"], KEY = "ndd2-ver-dash";
  function go() { var s = document.createElement("script"); s.type = "module"; s.src = "dash.js"; document.body.appendChild(s); }
  fetch("../js/config.js?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
    var m = /APP_VERSION = "([^"]+)"/.exec(t), v = m && m[1], old = null; try { old = localStorage.getItem(KEY); } catch (e) { }
    if (!v || v === old) return go();
    return Promise.all(FILES.map(function (f) { return fetch(f, { cache: "reload" }).catch(function () { }); })).then(function () { try { localStorage.setItem(KEY, v); } catch (e) { } go(); });
  }).catch(go);
})();
</script>
</body>
</html>
